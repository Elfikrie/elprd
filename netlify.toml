[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  VITE_API_URL = "same-origin"

# HashRouter melayani halaman client dari index.html; jangan menelan /api/* dengan rewrite SPA.
[server]
  path = "/api/*"

[server.scale]
  min = 0
  max = 1

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
