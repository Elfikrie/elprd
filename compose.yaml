services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rancang
      POSTGRES_USER: rancang
      POSTGRES_PASSWORD: rancang_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rancang_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rancang -d rancang"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  rancang_data:

